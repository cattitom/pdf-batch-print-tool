[package]
name = "shipping-shell"
version = "0.1.0"
description = "出货助手（本地清单、离线记录与电脑数据同步）"
authors = ["you"]
edition = "2021"

# 移动端目标要这三种 crate-type（Tauri iOS / Android 依赖 staticlib）
[lib]
name = "shipping_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# 扫码：原生 AVFoundation（WKWebView 的 getUserMedia 在真机上不稳）
tauri-plugin-barcode-scanner = "2"
# 只为了解 UDP 发现应答里的 {port, token}
serde = { version = "1", features = ["derive"] }
serde_json = "1"
if-addrs = "0.15.0"

[target.'cfg(target_os="ios")'.dependencies]
libc = "0.2.191"
