<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>出货助手</title>
<style>
  :root {
    --bg: #0f1519;
    --card: #172027;
    --text: #e6edf2;
    --dim: #8fa3b0;
    --accent: #35c48a;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    overflow: hidden;
  }
  #view {
    position: fixed; inset: 0; width: 100%; height: 100%; border: 0;
    background: #fff; display: none;
  }
  #gate {
    position: fixed; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 18px;
    padding: max(24px, env(safe-area-inset-top)) 28px max(24px, env(safe-area-inset-bottom));
    text-align: center;
  }
  .spin {
    width: 34px; height: 34px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.14); border-top-color: var(--accent);
    animation: turn .9s linear infinite;
  }
  @keyframes turn { to { transform: rotate(360deg); } }
  .title { font-size: 17px; font-weight: 600; letter-spacing: .3px; }
  .sub { color: var(--dim); font-size: 13px; max-width: 300px; overflow-wrap: anywhere; }
  .icon-bad {
    width: 40px; height: 40px; border-radius: 50%;
    background: rgba(255,107,107,.14); color: var(--danger);
    display: flex; align-items: center; justify-content: center;
    font-size: 22px; font-weight: 700;
  }
  button {
    appearance: none; border: 0; border-radius: 12px;
    background: var(--accent); color: #06231a;
    font-size: 15px; font-weight: 600; padding: 12px 26px;
  }
  button:active { opacity: .8; }
  .hint { color: var(--dim); font-size: 12px; line-height: 1.7; }
  .hide { display: none !important; }
</style>
</head>
<body>
<iframe id="view" allow="clipboard-read; clipboard-write"></iframe>

<div id="gate">
  <div id="spinner" class="spin"></div>
  <div id="title" class="title">正在找电脑…</div>
  <div id="sub" class="sub">手机和电脑要在同一个 WiFi 下</div>
  <button id="retry" class="hide">重试</button>
  <div id="hint" class="hint hide">
    还找不到？<br />① 电脑上的「手机出货」面板开着没<br />② 电脑防火墙放行了没（面板里有按钮）
  </div>
</div>

<script>
(function () {
  var view = document.getElementById('view');
  var gate = document.getElementById('gate');
  var spinner = document.getElementById('spinner');
  var title = document.getElementById('title');
  var sub = document.getElementById('sub');
  var retry = document.getElementById('retry');
  var hint = document.getElementById('hint');

  var invoke = window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke;

  function searching() {
    gate.classList.remove('hide');
    view.style.display = 'none';
    view.removeAttribute('src');
    spinner.classList.remove('hide');
    retry.classList.add('hide');
    hint.classList.add('hide');
    title.textContent = '正在找电脑…';
    sub.textContent = '手机和电脑要在同一个 WiFi 下';
  }

  function failed(msg) {
    gate.classList.remove('hide');
    view.style.display = 'none';
    spinner.classList.add('hide');
    retry.classList.remove('hide');
    hint.classList.remove('hide');
    title.textContent = '没找到电脑';
    // 把原生层返回的真实原因摆到界面上（权限被拒 / 广播发不出 / 没人应答），别只打 console
    var detail = msg ? String(msg) : '';
    sub.textContent = detail && detail !== '没找到电脑' ? detail : '检查是否同一 WiFi 后，点下面重试';
  }

  function connect() {
    if (!invoke) {
      failed('当前不在 App 里运行（没有 Tauri 接口）');
      return;
    }
    searching();
    invoke('discover_peer').then(function (peer) {
      if (!peer || !peer.url) { failed('电脑没回地址'); return; }
      view.onload = function () { gate.classList.add('hide'); };
      view.src = peer.url;
      view.style.display = 'block';
      // 网页首屏慢时也别一直白屏：先露出 iframe，加载完再收门帘
      setTimeout(function () { if (view.src) gate.classList.add('hide'); }, 1500);
    }).catch(function (e) {
      failed(String(e));
    });
  }

  retry.addEventListener('click', connect);
  document.addEventListener('visibilitychange', function () {
    // 从后台切回来、还没连上就再找一次
    if (!document.hidden && !view.src) connect();
  });

  connect();
})();
</script>
</body>
</html>
