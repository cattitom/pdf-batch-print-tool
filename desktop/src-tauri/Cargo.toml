[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
pdfimpose-core = { path = "../core" }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
log = { version = "0.4", features = ["std"] }
# PaddleOCR（MNN 推理）：models/ 下有 .mnn 模型时优先用它，比系统 OCR 准
ocr-rs = "2.4"
# 手机出货：局域网小服务 + 二维码
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 枚举网卡挑局域网 IP（跳过 VPN / 虚拟网卡）
local-ip-address = "0.6"
mdns-sd = "0.21.6"
# 微信本地库解密：SQLCipher4（AES-256-CBC + HMAC-SHA512）
aes = "0.8"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
md-5 = "0.10"
# 微信消息里的引用/文件是 zstd 压缩：用纯 Rust 解码，避免 zstd-sys 的 C 构建
ruzstd = "0.8"
chrono = "0.4"
regex = "1"

# 查找 WPS 安装路径（读取注册表）
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# 装箱单图片识别：直接用系统自带 OCR（Windows.Media.Ocr），离线、免费
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
    "Win32_System_Com",
    # 微信解密：读 Weixin.exe 进程内存
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
] }
# 识别前放大图片（小字号直接 OCR 掉字严重）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows-future = "0.3"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true


