[package]
name = "desktop"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
pdfimpose-core = { path = "../core" }
base64 = "0.22"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ts-rs = "12"
log = { version = "0.4", features = ["std"] }
# PaddleOCR（MNN 推理）：唯一 OCR 引擎，运行识别需要完整模型
ocr-rs = "2.4"
# 手机出货：局域网小服务 + 二维码
tiny_http = "0.12"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
# 枚举网卡挑局域网 IP（跳过 VPN / 虚拟网卡）
local-ip-address = "0.6"
mdns-sd = "0.21.6"
# 微信本地库解密：SQLCipher4（AES-256-CBC + HMAC-SHA512）
aes = "0.8"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
md-5 = "0.10"
# 微信消息里的引用/文件是 zstd 压缩：用纯 Rust 解码，避免 zstd-sys 的 C 构建
ruzstd = "0.8"
chrono = "0.4"
regex = "1"

# 查找 WPS 安装路径（读取注册表）
[target.'cfg(windows)'.dependencies]
winreg = "0.56"
# 微信本机进程读取所需的 Windows API；OCR 仅使用 PaddleOCR。
windows = { version = "0.62", features = [
    # 微信解密：读 Weixin.exe 进程内存
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Diagnostics_Debug",
] }
# 识别前放大图片（小字号直接 OCR 掉字严重）
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
# 打包速度优先：fat LTO + 单 codegen unit 在这棵依赖树上要 3-8 分钟，
# 改一行手机页文案（m.js 是 include_str! 编进去的）就得重新 fat link 一次，太亏。
# thin LTO + 16 个 codegen unit：链接快 2-3 倍，体积大约 +10%，内部工具无所谓。
[profile.release]
codegen-units = 16
lto = "thin"
opt-level = 2
panic = "abort"
strip = true


