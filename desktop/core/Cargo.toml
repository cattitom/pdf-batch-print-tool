[package]
name = "pdfimpose-core"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
lopdf = "0.45"
pdfium-render = "0.9"
pdfium-bundled = "0.2"
genpdf = { version = "0.2.0", features = ["images"] }
barcoders = { version = "2", features = ["image"] }
# 产品标签按绝对坐标排版（genpdf 是流式排版，做不了精确位置）
printpdf = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = "0.25"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12"
log = "0.4"
# Excel 文件格式、合并区域与字体颜色由 rxls 读取；CSV 兼容 GBK。
rxls = { version = "0.1.4", default-features = false, features = ["xlsx"] }
encoding_rs = "0.8"
ttf-parser = "0.25.1"
