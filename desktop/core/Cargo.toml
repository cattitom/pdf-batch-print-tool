[package]
name = "pdfimpose-core"
version = "0.1.0"
edition = "2021"

[dependencies]
regex = "1"
lopdf = "0.45"
pdfium-render = "0.9"
pdfium-bundled = "0.2"
genpdf = { version = "0.2.0", features = ["images"] }
barcoders = { version = "2", features = ["image"] }
# 产品标签按绝对坐标排版（genpdf 是流式排版，做不了精确位置）
printpdf = "0.3"
qrcode = { version = "0.14", default-features = false, features = ["image"] }
image = "0.25"
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
ts-rs = "12"
log = "0.4"
# 装箱单解析：xlsx 就是 zip，只用得上 deflate；csv 在中文 Windows 常是 GBK
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
encoding_rs = "0.8"
ttf-parser = "0.25.1"
