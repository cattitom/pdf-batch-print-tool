name: iOS 出货助手 IPA

on:
  # 只手动触发：推代码不会自动跑，省 macOS runner 额度
  workflow_dispatch:

jobs:
  build:
    # macos-14 自带 Xcode 15，打不开 Tauri 生成的新格式工程（objectVersion 77）
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Node（装 tauri CLI 用）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Tauri CLI
        run: npm i -g "@tauri-apps/cli@^2"

      - name: Rust + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ios-shell/src-tauri -> target"

      - name: Xcode 版本（排查用）
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: 生成 iOS 工程
        working-directory: ios-shell/src-tauri
        run: tauri ios init --ci

      - name: 补 tauri 脚本（Xcode 的 Build Rust Code 相位跑的是 node tauri）
        run: |
          CLI=$(readlink -f "$(which tauri)")
          echo "CLI=$CLI"
          cat > ios-shell/src-tauri/gen/apple/tauri <<EOF
          #!/usr/bin/env node
          const { spawnSync } = require('child_process');
          const r = spawnSync(process.execPath, ['$CLI', ...process.argv.slice(2)], { stdio: 'inherit' });
          process.exit(r.status === null ? 1 : r.status);
          EOF
          chmod +x ios-shell/src-tauri/gen/apple/tauri
          node ios-shell/src-tauri/gen/apple/tauri --version

      - name: 打印 iOS 工程（排查用）
        run: |
          ls -la ios-shell/src-tauri/gen/apple | head -40
          echo '--- project.yml ---'
          sed -n '1,220p' ios-shell/src-tauri/gen/apple/project.yml 2>/dev/null || echo '(没有 project.yml)'
          echo '--- which tauri ---'
          which tauri || true
          node -v || true

      - name: 允许局域网明文（ATS）
        run: |
          PLIST=$(find ios-shell/src-tauri/gen/apple -name "Info.plist" | head -1)
          echo "Info.plist: $PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || true

      - name: pod install（生成 xcworkspace）
        working-directory: ios-shell/src-tauri/gen/apple
        run: |
          # Tauri 的 Podfile 模板带一个 macOS target，但纯 iOS 工程没建它，pod install 会直接报错
          python3 - <<'PY'
          import re
          s = open('Podfile').read()
          out, i = [], 0
          lines = s.splitlines(True)
          skip = False
          for line in lines:
              if re.match(r"\s*target\s+['\"][^'\"]*_macOS['\"]", line):
                  skip = True
              if skip:
                  if re.match(r"\s*end\s*$", line):
                      skip = False
                  continue
              out.append(line)
          open('Podfile', 'w').write(''.join(out))
          print(''.join(out))
          PY
          pod install

      - name: 列出 Xcode 工程 / scheme
        working-directory: ios-shell/src-tauri/gen/apple
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          echo "workspace=$WS"
          echo "WS=$WS" >> "$GITHUB_ENV"
          xcodebuild -list -workspace "$WS" -json | tee /tmp/list.json

      - name: 编译（不签名）
        working-directory: ios-shell/src-tauri/gen/apple
        run: |
          set -uo pipefail
          python3 -c "import json;print('schemes=', ' '.join(json.load(open('/tmp/list.json'))['workspace']['schemes']))"
          # schemes[0] 往往是 'Pods-xxx' 聚合 scheme，编它不会产出 .app；要挑真正的 app scheme
          SCHEME=$(python3 -c "import json;s=json.load(open('/tmp/list.json'))['workspace']['schemes'];print(next((x for x in s if not x.startswith('Pods-')), s[0]))")
          echo "scheme=$SCHEME"
          # 外层是 bash -e，xcodebuild 一失败就整个退出、日志全丢，先关掉
          set +e
          xcodebuild \
            -workspace "$WS" \
            -scheme "$SCHEME" \
            -configuration debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            ARCHS=arm64 \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            build > /tmp/xcodebuild.log 2>&1
          RC=$?
          set -e
          echo "xcodebuild exit=${RC}, log lines=$(wc -l < /tmp/xcodebuild.log)"
          grep -Ei "error" /tmp/xcodebuild.log | tail -40 || true
          if [ "${RC}" -ne 0 ]; then
            echo "----- log head (60) -----"
            head -60 /tmp/xcodebuild.log
            echo "----- log tail (120) -----"
            tail -120 /tmp/xcodebuild.log
            exit "${RC}"
          fi
          echo "--- 找得到的 .app ---"
          find . -name "*.app" -type d | head -20
          # 工程 xcconfig 可能覆盖 SYMROOT，直接问 xcodebuild 要真实产物路径
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration debug -sdk iphoneos \
            -derivedDataPath build -showBuildSettings -json > /tmp/settings.json 2>/dev/null || true
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          try:
              d = json.load(open('/tmp/settings.json'))
          except Exception as e:
              print('# showBuildSettings 解析失败: %s' % e)
              raise SystemExit(0)
          for item in (d if isinstance(d, list) else [d]):
              bs = item.get('buildSettings', {})
              name = bs.get('FULL_PRODUCT_NAME', '')
              if name.endswith('.app'):
                  print('APP_PATH=' + os.path.join(bs.get('TARGET_BUILD_DIR', ''), name))
                  break
          PY

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore

      - name: 组装未签名 IPA
        run: |
          set -uo pipefail
          APP="${APP_PATH:-}"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            APP=$(find ios-shell -name "*.app" -type d -not -path "*/Pods/*" | head -1)
          fi
          echo "app=$APP"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::没找到 .app，打印线索："
            ls -la ios-shell/src-tauri/gen/apple/build/Build/Products 2>/dev/null || echo "(无 Products 目录)"
            find ios-shell/src-tauri/gen/apple -maxdepth 4 -type d | head -60
            exit 1
          fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry shipping-shell-unsigned.ipa Payload
          ls -lh shipping-shell-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: shipping-shell-ipa
          path: shipping-shell-unsigned.ipa
          if-no-files-found: error