name: iOS 出货助手 IPA

on:
  # 只手动触发：推代码不会自动跑，省 macOS runner 额度
  workflow_dispatch:

jobs:
  build:
    # macos-14 自带 Xcode 15，打不开 Tauri 生成的新格式工程（objectVersion 77）
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Node（装 tauri CLI 用）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装 Tauri CLI
        run: npm i -g "@tauri-apps/cli@^2.12.4"

      - name: Rust + iOS target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: 缓存 cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "ios-shell/src-tauri -> target"

      - name: Xcode 版本（排查用）
        run: |
          xcodebuild -version
          ls /Applications | grep -i xcode || true

      - name: 生成 iOS 工程
        working-directory: ios-shell/src-tauri
        run: tauri ios init --ci

      - name: 补 tauri 脚本（Xcode 的 Build Rust Code 相位跑的是 node tauri）
        run: |
          CLI=$(readlink -f "$(which tauri)")
          echo "CLI=$CLI"
          cat > ios-shell/src-tauri/gen/apple/tauri <<EOF
          #!/usr/bin/env node
          const { spawnSync } = require('child_process');
          const r = spawnSync(process.execPath, ['$CLI', ...process.argv.slice(2)], { stdio: 'inherit' });
          process.exit(r.status === null ? 1 : r.status);
          EOF
          chmod +x ios-shell/src-tauri/gen/apple/tauri
          node ios-shell/src-tauri/gen/apple/tauri --version

      - name: 关掉签名（CI 没有开发团队，xcodebuild 会直接报 requires a development team）
        run: |
          python3 - <<'PY'
          p = 'ios-shell/src-tauri/gen/apple/shipping-shell.xcodeproj/project.pbxproj'
          s = open(p).read()
          ins = ('\t\t\t\tCODE_SIGNING_ALLOWED = NO;\n'
                 '\t\t\t\tCODE_SIGNING_REQUIRED = NO;\n'
                 '\t\t\t\tCODE_SIGN_IDENTITY = "";\n'
                 '\t\t\t\tCODE_SIGN_STYLE = Manual;\n'
                 '\t\t\t\tDEVELOPMENT_TEAM = "";\n'
                 '\t\t\t\tENABLE_USER_SCRIPT_SANDBOXING = NO;\n')
          n = s.count('buildSettings = {')
          out = s.replace('buildSettings = {', 'buildSettings = {\n' + ins)
          open(p, 'w').write(out)
          print('patched buildSettings blocks:', n)
          PY
      - name: 打印 iOS 工程（排查用）
        run: |
          ls -la ios-shell/src-tauri/gen/apple | head -40
          echo '--- project.yml ---'
          sed -n '1,220p' ios-shell/src-tauri/gen/apple/project.yml 2>/dev/null || echo '(没有 project.yml)'
          echo '--- which tauri ---'
          which tauri || true
          node -v || true

      - name: 允许局域网明文（ATS）
        run: |
          PLIST=$(find ios-shell/src-tauri/gen/apple -name "Info.plist" | head -1)
          echo "Info.plist: $PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsArbitraryLoads bool true" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST" || true
          # iOS 14+ 往局域网广播要这条说明，否则 UDP 发现会被静默拦掉
          /usr/libexec/PlistBuddy -c "Add :NSLocalNetworkUsageDescription string 在局域网里找到电脑上的出货服务" "$PLIST" || true
          # 扫码连接要用相机
          /usr/libexec/PlistBuddy -c "Add :NSCameraUsageDescription string 扫描电脑上的二维码来连接出货服务" "$PLIST" || true
          # Bonjour（DNSServiceBrowse）必须声明服务类型，否则 iOS 14+ 直接拒掉浏览
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices array" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Add :NSBonjourServices:0 string _shippingshell._tcp" "$PLIST" || true
          /usr/libexec/PlistBuddy -c "Print" "$PLIST" | head -40 || true

      - name: pod install（生成 xcworkspace）
        working-directory: ios-shell/src-tauri/gen/apple
        run: |
          # Tauri 的 Podfile 模板带一个 macOS target，但纯 iOS 工程没建它，pod install 会直接报错
          python3 - <<'PY'
          import re
          s = open('Podfile').read()
          out, i = [], 0
          lines = s.splitlines(True)
          skip = False
          for line in lines:
              if re.match(r"\s*target\s+['\"][^'\"]*_macOS['\"]", line):
                  skip = True
              if skip:
                  if re.match(r"\s*end\s*$", line):
                      skip = False
                  continue
              out.append(line)
          open('Podfile', 'w').write(''.join(out))
          print(''.join(out))
          PY
          pod install

      - name: 列出 Xcode 工程 / scheme
        working-directory: ios-shell/src-tauri/gen/apple
        run: |
          WS=$(ls -d *.xcworkspace | head -1)
          echo "workspace=$WS"
          echo "WS=$WS" >> "$GITHUB_ENV"
          xcodebuild -list -workspace "$WS" -json | tee /tmp/list.json

      - name: 编译（不签名）
        working-directory: ios-shell/src-tauri
        run: |
          set +e
          # 不能直接 xcodebuild：Build Rust Code 相位要读 gen/apple/.tauri/cli-options-server.json，
          # 那个文件只有 tauri ios build / tauri ios dev 在跑的时候才会写。
          # 别给 `--` 传 KEY=VALUE：那些参数会原样塞进 cargo build，直接报 unexpected argument。
          # 签名和脚本沙箱都在工程里关掉了（见上面的 pbxproj 补丁）。
          # --no-sign：归档后不跑 xcodebuild -exportArchive（CI 没有团队 ID，那步必然报
          #   "teamID" should be non-empty），改由 CLI 把归档里的 .app 塞进 Payload 打成未签名 .ipa。
          tauri ios build --debug --ci --target aarch64 --no-sign > /tmp/xcodebuild.log 2>&1
          RC=$?
          set -e
          echo "tauri ios build exit=${RC}, log lines=$(wc -l < /tmp/xcodebuild.log)"
          grep -Ei "error|failed" /tmp/xcodebuild.log | tail -40 || true
          if [ "${RC}" -ne 0 ]; then
            echo "----- log head (40) -----"
            head -40 /tmp/xcodebuild.log
            echo "----- log tail (150) -----"
            tail -150 /tmp/xcodebuild.log
            exit "${RC}"
          fi
          echo "--- 找得到的 .ipa / .app ---"
          find "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -type d \
            -not -path "*/Pods/*" -not -path "*/Index.noindex/*" 2>/dev/null | head -10
          find gen/apple/build -name "*.ipa" -type f 2>/dev/null | head -10

      - name: 上传编译日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: /tmp/xcodebuild.log
          if-no-files-found: ignore

      - name: 收集未签名 IPA
        run: |
          set -uo pipefail
          # --no-sign 会直接用归档里的 .app 打 Payload/App.ipa，优先用它
          IPA=$(find ios-shell/src-tauri/gen/apple/build -name "*.ipa" -type f 2>/dev/null | head -1)
          if [ -n "$IPA" ]; then
            echo "ipa=$IPA"
            cp "$IPA" shipping-shell-unsigned.ipa
            ls -lh shipping-shell-unsigned.ipa
            exit 0
          fi
          echo "没找到 CLI 产出的 IPA，退回从 .app 手工打包"
          APP=$(find ios-shell "$HOME/Library/Developer/Xcode/DerivedData" -name "*.app" -type d \
                  -not -path "*/Pods/*" -not -path "*/Index.noindex/*" 2>/dev/null | head -1)
          echo "app=$APP"
          if [ -z "$APP" ] || [ ! -d "$APP" ]; then
            echo "::error::没找到 .app，打印线索："
            find "$HOME/Library/Developer/Xcode/DerivedData" -maxdepth 4 -name "*.app" 2>/dev/null | head -20
            ls -la "$HOME/Library/Developer/Xcode/DerivedData" 2>/dev/null | head -10
            exit 1
          fi
          rm -rf Payload && mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry shipping-shell-unsigned.ipa Payload
          ls -lh shipping-shell-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: shipping-shell-ipa
          path: shipping-shell-unsigned.ipa
          if-no-files-found: error